---
fixes:
  - |
    Fixed amphora certificate generation when the issuing CA's Subject Key
    Identifier (SKI) was not derived using SHA-1. The amphora certificate's
    Authority Key Identifier (AKI) is now copied from the CA certificate's
    SKI, with public-key derivation retained as a fallback for CAs without an
    SKI. This restores compatibility with CAs generated by cert-manager 1.20
    and other issuers using a different SKI derivation algorithm.
