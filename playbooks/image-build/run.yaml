- hosts: all
  tasks:
    # Workaround for Red Hat like distros: SELinux prevents diskimage-builder
    # from creating a RPM DB dir in a chroot on Centos 9 Stream
    - name: Disable SELinux on Red Hat distributions
      selinux:
        state: disabled
      become: yes
      when:
        - ansible_os_family == 'RedHat'
    - name: Install required packages on Red Hat distributions
      package:
        name:
          # Required by ansible pip module on centos
          - python3-packaging
          # Required by dib bindep dependencies (gdisk)
          - epel-release
        state: present
      become: yes
      when:
        - ansible_os_family == 'RedHat'
    # Installing epel-release doesn't automatically enable the repository
    - name: Enable EPEL repo on Red Hat distributions
      shell: |
        dnf config-manager --set-enable epel
      become: yes
      when:
        - ansible_os_family == 'RedHat'
    - name: Install required pip packages
      pip:
        name: "{{  item }}"
        state: "latest"
        virtualenv: /var/tmp/venv
        virtualenv_command: python3 -m venv
      register: install_packages
      until: install_packages is success
      retries: 5
      delay: 2
      become: yes
      with_items:
        - bindep
        - diskimage-builder
        - setuptools
    - name: Install binary dependencies from diskimage-builder
      include_role:
        name: bindep
      vars:
        bindep_dir: "{{ ansible_user_dir }}/{{ zuul.projects['opendev.org/openstack/diskimage-builder'].src_dir }}"
    - name: Ensure artifacts/images directory exists
      file:
        path: '{{ ansible_user_dir }}/test-images'
        state: directory
    - name: Detect CI mirror configuration
      shell: |
        if [ -e /etc/ci/mirror_info.sh ]; then
          . /etc/ci/mirror_info.sh
          echo "NODEPOOL_UBUNTU_MIRROR=${NODEPOOL_UBUNTU_MIRROR:-}"
          echo "NODEPOOL_PYPI_MIRROR=${NODEPOOL_PYPI_MIRROR:-}"
          echo "NODEPOOL_WHEEL_MIRROR=${NODEPOOL_WHEEL_MIRROR:-}"
        fi
      args:
        executable: /bin/bash
      register: mirror_info
      tags:
        - skip_ansible_lint
    - name: Set distribution mirror fact for Ubuntu
      set_fact:
        dib_distribution_mirror: "{{ mirror_info.stdout | regex_search('NODEPOOL_UBUNTU_MIRROR=(.+)', '\\1') | first }}"
      when:
        - mirror_info.stdout is search('NODEPOOL_UBUNTU_MIRROR=.+')
        - amphora_os == 'ubuntu'
    - name: Set pypi mirror facts
      set_fact:
        dib_pypi_mirror: "{{ mirror_info.stdout | regex_search('NODEPOOL_PYPI_MIRROR=(.+)', '\\1') | first }}"
        dib_wheel_mirror: "{{ mirror_info.stdout | regex_search('NODEPOOL_WHEEL_MIRROR=(.+)', '\\1') | first }}"
      when:
        - mirror_info.stdout is search('NODEPOOL_PYPI_MIRROR=.+')
    - name: Build an amphora image for publishing
      shell: >-
        . /var/tmp/venv/bin/activate && \
        ./diskimage-create.sh -o {{ ansible_user_dir }}/test-images/test-only-amphora-x64-haproxy-{{ amphora_os }}-{{ amphora_os_release }}.qcow2 \
              -i {{ amphora_os }} \
              -d {{ amphora_os_release }} \
              -s {{ amphora_image_size | default(2) }}
      args:
        chdir: "{{ ansible_user_dir }}/src/opendev.org/openstack/octavia/diskimage-create"
      # CI mirrors are unsigned (GPG is also disabled on the host by
      # configure-mirrors' 99unauthenticated apt config), so we pass
      # --no-check-gpg to debootstrap and include allow-insecure-apt
      # to let apt-get update work inside the chroot.
      environment: >-
        {{
          {}
          | combine(dib_distribution_mirror is defined
                    | ternary({'DIB_DISTRIBUTION_MIRROR': dib_distribution_mirror,
                               'DIB_DEBOOTSTRAP_EXTRA_ARGS': '--no-check-gpg'}, {}))
          | combine(dib_pypi_mirror is defined
                    | ternary({'DIB_PYPI_MIRROR_URL': dib_pypi_mirror,
                               'DIB_PYPI_MIRROR_URL_1': dib_wheel_mirror | default(''),
                               'DIB_PIP_RETRIES': '0'}, {}))
          | combine({'DIB_LOCAL_ELEMENTS':
                     ((dib_distribution_mirror is defined) | ternary('allow-insecure-apt', ''))
                     ~ ' '
                     ~ ((dib_pypi_mirror is defined) | ternary('pypi', ''))
                     | trim}
                    if (dib_distribution_mirror is defined or dib_pypi_mirror is defined)
                    else {})
        }}
      tags:
        - skip_ansible_lint
